

[package]
name = "rust-silos-macros"
version.workspace = true
edition.workspace = true
description = "Proc-macro for rust-silos: embed directories as static maps at compile time."
license = "MIT OR Apache-2.0"
repository.workspace = true
categories = ["filesystem", "embedded", "development-tools::build-utils"]
keywords = ["embed", "proc-macro", "filesystem", "static", "assets"]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.2"
proc-macro2.workspace = true
quote.workspace = true
rust-silos-macros-impl = { workspace = true }
